<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDS Link Hub Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); color: #1e293b; border-radius: 1rem; }
        .sys-hidden { display: none !important; }
        .card-hover { transition: all 0.3s ease; }
        .card-hover:hover { transform: translateY(-5px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <!-- Status Bar -->
    <div class="max-w-6xl mx-auto mb-4 flex justify-between items-center text-sm">
        <div id="db-status" class="flex items-center gap-2 text-yellow-400">
            <i class="fa-solid fa-circle text-xs"></i> <span>กำลังเชื่อมต่อฐานข้อมูล...</span>
        </div>
        <div id="sync-time" class="text-slate-400">รออัปเดต...</div>
    </div>

    <!-- Admin Panel -->
    <div id="admin-panel" class="max-w-6xl mx-auto mb-6 bg-amber-500 text-amber-950 p-4 rounded-xl flex flex-col md:flex-row justify-between items-center gap-4 sys-hidden shadow-lg">
        <div class="flex items-center gap-3 font-semibold">
            <i class="fa-solid fa-user-shield text-xl"></i> โหมดผู้ดูแลระบบ (Admin)
        </div>
        <div class="flex flex-wrap gap-2">
            <button onclick="openCategoryModal()" class="bg-amber-600 hover:bg-amber-700 text-white px-3 py-2 rounded-lg text-sm transition">
                <i class="fa-solid fa-tags mr-1"></i> จัดการหมวดหมู่
            </button>
            <button onclick="backupData()" class="bg-amber-600 hover:bg-amber-700 text-white px-3 py-2 rounded-lg text-sm transition">
                <i class="fa-solid fa-download mr-1"></i> สำรองข้อมูล
            </button>
            <button onclick="document.getElementById('fileRestore').click()" class="bg-amber-600 hover:bg-amber-700 text-white px-3 py-2 rounded-lg text-sm transition">
                <i class="fa-solid fa-upload mr-1"></i> กู้คืน
            </button>
            <input type="file" id="fileRestore" class="hidden" accept=".json" onchange="restoreData(event)">
            
            <button onclick="changePassword()" class="bg-amber-600 hover:bg-amber-700 text-white px-3 py-2 rounded-lg text-sm transition">
                <i class="fa-solid fa-key mr-1"></i> เปลี่ยนรหัส
            </button>
            <button onclick="logoutAdmin()" class="bg-slate-800 hover:bg-slate-900 text-white px-3 py-2 rounded-lg text-sm transition ml-2 border border-amber-400">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> ออกจากระบบ
            </button>
        </div>
    </div>

    <!-- Main Container -->
    <div class="max-w-6xl mx-auto glass-panel p-6 md:p-8 shadow-2xl mb-8">
        <div class="text-center mb-8 relative">
            <button id="btn-login" onclick="promptLogin()" class="absolute right-0 top-0 text-amber-600 bg-amber-100 px-3 py-1.5 rounded-lg text-sm font-semibold hover:bg-amber-200 transition">
                <i class="fa-solid fa-lock"></i> Admin Mode
            </button>
            <h1 class="text-4xl md:text-5xl font-bold text-blue-800 mb-2 tracking-tight">EDS EDSPORTAL</h1>
            <span class="bg-slate-800 text-white px-4 py-1 rounded-full text-sm font-semibold tracking-widest uppercase">Beyond Service Generation</span>
            <h2 class="text-xl font-medium text-slate-600 mt-6">ศูนย์รวมลิงก์ระบบงาน (Link of Work)</h2>
        </div>

        <div class="flex flex-col md:flex-row gap-4 mb-6">
            <div class="relative flex-grow">
                <i class="fa-solid fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="searchInput" onkeyup="renderLinks()" placeholder="ค้นหาชื่อระบบ, คำอธิบาย หรือกลุ่มงาน..." class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white text-slate-900 placeholder-slate-400">
            </div>
            <button onclick="openModal()" class="admin-only sys-hidden bg-amber-500 hover:bg-amber-600 text-white px-6 py-3 rounded-xl font-medium transition shadow-md whitespace-nowrap">
                <i class="fa-solid fa-plus mr-2"></i> เพิ่มลิงก์ใหม่
            </button>
        </div>

        <div id="category-tabs" class="flex flex-wrap justify-center gap-2 mb-8"></div>
    </div>

    <!-- Stats & Grid -->
    <div id="stats-container" class="max-w-6xl mx-auto grid grid-cols-2 md:grid-cols-5 gap-4 mb-8"></div>
    <div id="links-grid" class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

    <!-- ----------------- MODALS ----------------- -->
    
    <!-- Link Modal -->
    <div id="linkModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center sys-hidden">
        <div class="bg-white rounded-2xl w-full max-w-lg mx-4 overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
            <div class="p-6 overflow-y-auto">
                <h3 id="modalTitle" class="text-2xl font-bold text-slate-800 mb-6 text-center">เพิ่มลิงก์ใหม่</h3>
                <input type="hidden" id="linkId">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">ชื่อระบบ (Title)</label>
                        <input type="text" id="linkTitle" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 bg-white text-slate-900">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">URL ลิงก์</label>
                        <input type="url" id="linkUrl" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 bg-white text-slate-900">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">หมวดหมู่</label>
                            <select id="linkCategory" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 bg-white text-slate-900"></select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">กลุ่มงาน</label>
                            <input type="text" id="linkGroup" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 bg-white text-slate-900">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">สีการ์ด</label>
                            <div class="flex gap-2" id="colorPicker">
                                <button onclick="selectColor('blue')" class="w-8 h-8 rounded-full bg-blue-600 focus:ring-4 ring-offset-2 ring-blue-300"></button>
                                <button onclick="selectColor('amber')" class="w-8 h-8 rounded-full bg-amber-500 focus:ring-4 ring-offset-2 ring-amber-300"></button>
                                <button onclick="selectColor('emerald')" class="w-8 h-8 rounded-full bg-emerald-500 focus:ring-4 ring-offset-2 ring-emerald-300"></button>
                                <button onclick="selectColor('rose')" class="w-8 h-8 rounded-full bg-rose-500 focus:ring-4 ring-offset-2 ring-rose-300"></button>
                                <button onclick="selectColor('purple')" class="w-8 h-8 rounded-full bg-purple-500 focus:ring-4 ring-offset-2 ring-purple-300"></button>
                            </div>
                            <input type="hidden" id="linkColor" value="blue">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">โทนสี (Shade)</label>
                            <select id="linkShade" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 bg-white text-slate-900">
                                <option value="light">สว่าง (Light)</option>
                                <option value="medium">กลาง (Medium)</option>
                                <option value="dark">เข้ม (Dark)</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">ไอคอน</label>
                        <div class="grid grid-cols-5 gap-2 text-center" id="iconPicker">
                            <button onclick="selectIcon('fa-link')" class="p-2 border rounded hover:bg-slate-100 text-slate-600"><i class="fa-solid fa-link"></i></button>
                            <button onclick="selectIcon('fa-warehouse')" class="p-2 border rounded hover:bg-slate-100 text-slate-600"><i class="fa-solid fa-warehouse"></i></button>
                            <button onclick="selectIcon('fa-boxes-stacked')" class="p-2 border rounded hover:bg-slate-100 text-slate-600"><i class="fa-solid fa-boxes-stacked"></i></button>
                            <button onclick="selectIcon('fa-calendar-check')" class="p-2 border rounded hover:bg-slate-100 text-slate-600"><i class="fa-solid fa-calendar-check"></i></button>
                            <button onclick="selectIcon('fa-file-excel')" class="p-2 border rounded hover:bg-slate-100 text-slate-600"><i class="fa-solid fa-file-excel"></i></button>
                        </div>
                        <input type="hidden" id="linkIcon" value="fa-link">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">คำอธิบาย</label>
                        <textarea id="linkDesc" rows="2" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 bg-white text-slate-900"></textarea>
                    </div>
                </div>
            </div>
            <div class="p-4 border-t bg-slate-50 flex justify-end gap-3">
                <button onclick="closeModal()" class="px-5 py-2.5 rounded-lg text-slate-600 font-medium hover:bg-slate-200">ยกเลิก</button>
                <button onclick="saveLink()" class="px-5 py-2.5 rounded-lg text-white font-medium bg-blue-600 hover:bg-blue-700 shadow-md">บันทึกข้อมูล</button>
            </div>
        </div>
    </div>

    <!-- Category Modal -->
    <div id="categoryModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center sys-hidden">
        <div class="bg-white rounded-2xl w-full max-w-md mx-4 overflow-hidden shadow-2xl flex flex-col">
            <div class="p-6">
                <h3 class="text-xl font-bold text-slate-800 mb-4 text-center">จัดการหมวดหมู่</h3>
                <div class="flex gap-2 mb-4">
                    <input type="text" id="newCatName" placeholder="พิมพ์ชื่อหมวดหมู่ใหม่..." class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500 bg-white text-slate-900">
                    <button onclick="addCategory()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2 rounded-lg font-medium shadow"><i class="fa-solid fa-plus"></i></button>
                </div>
                <div id="categoryList" class="space-y-2 max-h-[50vh] overflow-y-auto pr-2"></div>
            </div>
            <div class="p-4 border-t bg-slate-50 flex justify-end">
                <button onclick="closeCategoryModal()" class="px-5 py-2 rounded-lg font-medium text-slate-600 hover:bg-slate-200">ปิด</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCrc4Gt8Ua7KJZIc_2pR2UTr-76rvKLADc",
            projectId: "eds-portal-21960",
            databaseURL: "https://eds-portal-21960-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let dbData = { links: [], categories: [], settings: { adminPin: "1234" } };
        let currentFilter = 'all';
        let isAdmin = false;

        // โครงสร้างสีตาม โทน (Shade)
        const themeMap = {
            blue: {
                light: { card: 'bg-white border-slate-100', icon: 'bg-blue-50 text-blue-600 border-blue-100', text1: 'text-slate-800', text2: 'text-slate-500', bar: 'bg-blue-500' },
                medium: { card: 'bg-blue-50 border-blue-200', icon: 'bg-blue-100 text-blue-700 border-blue-200', text1: 'text-blue-900', text2: 'text-blue-600', bar: 'bg-blue-500' },
                dark: { card: 'bg-blue-800 border-blue-700', icon: 'bg-blue-700 text-white border-blue-600', text1: 'text-white', text2: 'text-blue-200', bar: 'bg-blue-400' }
            },
            amber: {
                light: { card: 'bg-white border-slate-100', icon: 'bg-amber-50 text-amber-600 border-amber-100', text1: 'text-slate-800', text2: 'text-slate-500', bar: 'bg-amber-500' },
                medium: { card: 'bg-amber-50 border-amber-200', icon: 'bg-amber-100 text-amber-700 border-amber-200', text1: 'text-amber-900', text2: 'text-amber-700', bar: 'bg-amber-500' },
                dark: { card: 'bg-amber-600 border-amber-500', icon: 'bg-amber-500 text-white border-amber-400', text1: 'text-white', text2: 'text-amber-100', bar: 'bg-amber-400' }
            },
            emerald: {
                light: { card: 'bg-white border-slate-100', icon: 'bg-emerald-50 text-emerald-600 border-emerald-100', text1: 'text-slate-800', text2: 'text-slate-500', bar: 'bg-emerald-500' },
                medium: { card: 'bg-emerald-50 border-emerald-200', icon: 'bg-emerald-100 text-emerald-700 border-emerald-200', text1: 'text-emerald-900', text2: 'text-emerald-600', bar: 'bg-emerald-500' },
                dark: { card: 'bg-emerald-700 border-emerald-600', icon: 'bg-emerald-600 text-white border-emerald-500', text1: 'text-white', text2: 'text-emerald-100', bar: 'bg-emerald-400' }
            },
            rose: {
                light: { card: 'bg-white border-slate-100', icon: 'bg-rose-50 text-rose-600 border-rose-100', text1: 'text-slate-800', text2: 'text-slate-500', bar: 'bg-rose-500' },
                medium: { card: 'bg-rose-50 border-rose-200', icon: 'bg-rose-100 text-rose-700 border-rose-200', text1: 'text-rose-900', text2: 'text-rose-600', bar: 'bg-rose-500' },
                dark: { card: 'bg-rose-700 border-rose-600', icon: 'bg-rose-600 text-white border-rose-500', text1: 'text-white', text2: 'text-rose-100', bar: 'bg-rose-400' }
            },
            purple: {
                light: { card: 'bg-white border-slate-100', icon: 'bg-purple-50 text-purple-600 border-purple-100', text1: 'text-slate-800', text2: 'text-slate-500', bar: 'bg-purple-500' },
                medium: { card: 'bg-purple-50 border-purple-200', icon: 'bg-purple-100 text-purple-700 border-purple-200', text1: 'text-purple-900', text2: 'text-purple-600', bar: 'bg-purple-500' },
                dark: { card: 'bg-purple-800 border-purple-700', icon: 'bg-purple-700 text-white border-purple-600', text1: 'text-white', text2: 'text-purple-200', bar: 'bg-purple-400' }
            }
        };

        onValue(ref(db, '/'), (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                dbData.links = data.links || [];
                dbData.categories = data.categories || [
                    { id: "cct", name: "CCT", badge: "bg-blue-100 text-blue-800" },
                    { id: "she", name: "SHE", badge: "bg-indigo-100 text-indigo-800" },
                    { id: "inventory", name: "Inventory", badge: "bg-cyan-100 text-cyan-800" },
                    { id: "general", name: "ทั่วไป", badge: "bg-slate-100 text-slate-800" }
                ];
                dbData.settings = data.settings || dbData.settings;
            }
            
            document.getElementById('db-status').innerHTML = '<i class="fa-solid fa-circle text-emerald-500"></i> <span class="text-emerald-400">ออนไลน์ (Firebase)</span>';
            document.getElementById('sync-time').innerText = 'อัปเดต: ' + new Date().toLocaleTimeString();

            checkAdmin();
            renderTabs();
            renderLinks();
            renderCategoryList();
        });

        window.saveToFirebase = async () => {
            try { await set(ref(db, '/'), dbData); } 
            catch (error) { alert("เกิดข้อผิดพลาดในการบันทึก: " + error.message); }
        };

        window.renderTabs = () => {
            const tabsDiv = document.getElementById('category-tabs');
            let html = `<button onclick="setFilter('all')" class="px-5 py-2 rounded-full font-medium transition ${currentFilter === 'all' ? 'bg-blue-600 text-white shadow-md' : 'bg-white text-slate-600 hover:bg-slate-100'}">ทั้งหมด (${dbData.links.length})</button>`;
            
            dbData.categories.forEach(c => {
                const count = dbData.links.filter(l => l.category === c.id).length;
                const active = currentFilter === c.id ? 'bg-blue-600 text-white shadow-md' : 'bg-white text-slate-600 hover:bg-slate-100';
                html += `<button onclick="setFilter('${c.id}')" class="px-5 py-2 rounded-full font-medium transition ${active}">${c.name} (${count})</button>`;
            });
            tabsDiv.innerHTML = html;
        };

        window.setFilter = (cat) => { currentFilter = cat; renderTabs(); renderLinks(); };

        window.renderLinks = () => {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('links-grid');
            const stats = document.getElementById('stats-container');
            
            let filtered = dbData.links.filter(l => {
                const matchCat = currentFilter === 'all' || l.category === currentFilter;
                const matchSearch = l.title.toLowerCase().includes(search) || (l.desc && l.desc.toLowerCase().includes(search)) || (l.group && l.group.toLowerCase().includes(search));
                return matchCat && matchSearch;
            });

            let statsHtml = `<div class="bg-white rounded-xl p-4 text-center shadow-sm"><div class="text-slate-500 text-sm font-medium mb-1">ลิงก์รวม</div><div class="text-3xl font-bold text-slate-800">${dbData.links.length}</div></div>`;
            dbData.categories.forEach(c => {
                const count = dbData.links.filter(l => l.category === c.id).length;
                statsHtml += `<div class="bg-white rounded-xl p-4 text-center shadow-sm"><div class="text-slate-500 text-sm font-medium mb-1">${c.name}</div><div class="text-3xl font-bold text-slate-800">${count}</div></div>`;
            });
            stats.innerHTML = statsHtml;

            grid.innerHTML = filtered.map(link => {
                const catInfo = dbData.categories.find(c => c.id === link.category) || dbData.categories[0];
                const c = link.color || 'blue';
                const s = link.shade || 'light';
                const theme = themeMap[c] ? themeMap[c][s] : themeMap.blue.light;

                return `
                <div class="rounded-2xl p-6 shadow-sm border flex flex-col h-full card-hover relative overflow-hidden ${theme.card}">
                    <div class="absolute top-0 left-0 w-full h-2 ${theme.bar}"></div>
                    <div class="flex justify-between items-start mb-4 mt-2">
                        <div class="w-12 h-12 rounded-xl text-2xl flex items-center justify-center shadow-sm border ${theme.icon}">
                            <i class="fa-solid ${link.icon}"></i>
                        </div>
                        <div class="text-right">
                            <span class="inline-block px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-white/80 text-slate-800 shadow-sm">${catInfo.name}</span>
                            ${link.group ? `<div class="text-[10px] mt-1 uppercase tracking-wider ${theme.text2}">${link.group}</div>` : ''}
                        </div>
                    </div>
                    <h3 class="text-lg font-bold leading-tight mb-2 ${theme.text1}">${link.title}</h3>
                    <p class="text-sm mb-6 flex-grow line-clamp-2 ${theme.text2}">${link.desc || ''}</p>
                    <div class="mt-auto">
                        <a href="${link.url}" target="_blank" class="block w-full text-center py-3 rounded-xl font-semibold text-white ${theme.bar} hover:opacity-90 transition shadow-md">
                            เปิดลิงก์ <i class="fa-solid fa-arrow-up-right-from-square ml-1 text-sm"></i>
                        </a>
                        <div class="admin-only sys-hidden flex justify-end gap-2 mt-3 pt-3 border-t border-black/5">
                            <button onclick="editLink(${link.id})" class="text-slate-400 hover:text-amber-500 bg-black/5 hover:bg-black/10 w-8 h-8 rounded-lg transition"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteLink(${link.id})" class="text-slate-400 hover:text-red-500 bg-black/5 hover:bg-black/10 w-8 h-8 rounded-lg transition"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                </div>`;
            }).join('');
        };

        window.saveLink = () => {
            const id = document.getElementById('linkId').value;
            const link = {
                id: id ? parseInt(id) : Date.now(),
                title: document.getElementById('linkTitle').value,
                url: document.getElementById('linkUrl').value,
                category: document.getElementById('linkCategory').value,
                group: document.getElementById('linkGroup').value,
                color: document.getElementById('linkColor').value,
                shade: document.getElementById('linkShade').value,
                icon: document.getElementById('linkIcon').value,
                desc: document.getElementById('linkDesc').value
            };

            if (!link.title || !link.url) return alert('กรุณากรอกชื่อและ URL');

            if (id) {
                const index = dbData.links.findIndex(l => l.id === parseInt(id));
                if (index !== -1) dbData.links[index] = link;
            } else { dbData.links.push(link); }
            saveToFirebase();
            closeModal();
        };

        window.deleteLink = (id) => {
            if (confirm('ยืนยันการลบลิงก์นี้?')) {
                dbData.links = dbData.links.filter(l => l.id !== id);
                saveToFirebase();
            }
        };

        window.editLink = (id) => {
            const link = dbData.links.find(l => l.id === id);
            if (link) {
                document.getElementById('modalTitle').innerText = 'แก้ไขลิงก์';
                document.getElementById('linkId').value = link.id;
                document.getElementById('linkTitle').value = link.title;
                document.getElementById('linkUrl').value = link.url;
                
                const catSelect = document.getElementById('linkCategory');
                catSelect.innerHTML = dbData.categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
                document.getElementById('linkCategory').value = link.category;
                
                document.getElementById('linkGroup').value = link.group || '';
                document.getElementById('linkDesc').value = link.desc || '';
                document.getElementById('linkShade').value = link.shade || 'light';
                selectColor(link.color || 'blue');
                selectIcon(link.icon || 'fa-link');
                document.getElementById('linkModal').classList.remove('sys-hidden');
            }
        };

        // --- ระบบจัดการหมวดหมู่แบบใหม่ (จัดเรียง / พิมพ์แก้ไขได้) ---
        window.renderCategoryList = () => {
            const list = document.getElementById('categoryList');
            list.innerHTML = dbData.categories.map((c, index) => `
                <div class="flex items-center gap-2 p-2 bg-slate-50 border rounded-lg">
                    <div class="flex flex-col">
                        <button onclick="moveCat(${index}, -1)" class="text-slate-400 hover:text-blue-600 leading-none p-1" ${index === 0 ? 'opacity-30 cursor-not-allowed' : ''}><i class="fa-solid fa-caret-up"></i></button>
                        <button onclick="moveCat(${index}, 1)" class="text-slate-400 hover:text-blue-600 leading-none p-1" ${index === dbData.categories.length - 1 ? 'opacity-30 cursor-not-allowed' : ''}><i class="fa-solid fa-caret-down"></i></button>
                    </div>
                    <input type="text" value="${c.name}" onchange="updateCatName('${c.id}', this.value)" class="flex-grow p-1.5 border border-slate-300 rounded text-slate-900 bg-white focus:ring-2 focus:ring-amber-500" title="พิมพ์เพื่อแก้ชื่อหมวดหมู่">
                    <button onclick="deleteCategory('${c.id}')" class="text-red-500 hover:bg-red-100 p-2 rounded transition" title="ลบหมวดหมู่"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');
        };

        window.moveCat = (index, dir) => {
            if (index + dir < 0 || index + dir >= dbData.categories.length) return;
            const temp = dbData.categories[index];
            dbData.categories[index] = dbData.categories[index + dir];
            dbData.categories[index + dir] = temp;
            saveToFirebase(); // สลับตำแหน่งแล้วเซฟเลย
        };

        window.updateCatName = (id, newName) => {
            const cat = dbData.categories.find(c => c.id === id);
            if (cat && newName.trim() !== '') {
                cat.name = newName.trim();
                saveToFirebase(); // พิมพ์แก้ชื่อปุ๊บ เซฟลงฐานข้อมูลปั๊บ
            }
        };

        window.addCategory = () => {
            const name = document.getElementById('newCatName').value.trim();
            if (!name) return;
            const id = name.toLowerCase().replace(/[^a-z0-9]/g, '') || 'cat_' + Date.now(); 
            if (dbData.categories.find(c => c.id === id)) return alert('หมวดหมู่นี้มีอยู่แล้ว');
            
            dbData.categories.push({ id: id, name: name, badge: "bg-slate-100 text-slate-800" });
            document.getElementById('newCatName').value = '';
            saveToFirebase(); 
        };

        window.deleteCategory = (id) => {
            if(dbData.links.find(l => l.category === id)) return alert('ไม่สามารถลบได้ เนื่องจากมีลิงก์ที่ใช้หมวดหมู่นี้อยู่');
            if (confirm('ยืนยันการลบหมวดหมู่นี้?')) {
                dbData.categories = dbData.categories.filter(c => c.id !== id);
                saveToFirebase();
            }
        };

        // --- Backup & Restore ---
        window.backupData = () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dbData, null, 2));
            const dl = document.createElement('a');
            dl.setAttribute("href", dataStr);
            dl.setAttribute("download", `eds_backup_${new Date().toISOString().slice(0,10)}.json`);
            dl.click();
        };

        window.restoreData = (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (importedData.links && importedData.categories) {
                        dbData = importedData;
                        saveToFirebase();
                        alert('กู้คืนข้อมูลสำเร็จ!');
                    } else { alert('รูปแบบไฟล์ไม่ถูกต้อง'); }
                } catch (err) { alert('เกิดข้อผิดพลาดในการอ่านไฟล์'); }
            };
            reader.readAsText(file);
        };

        // --- Admin & Security ---
        window.changePassword = () => {
            const oldPass = prompt("กรุณาใส่รหัสผ่าน 'ปัจจุบัน':");
            if (oldPass !== dbData.settings.adminPin) return alert("รหัสผ่านเดิมไม่ถูกต้อง!");
            const newPass = prompt("ตั้งรหัสผ่าน 'ใหม่' (ตัวเลข 4-6 หลัก):");
            if (newPass && newPass.trim() !== "") {
                dbData.settings.adminPin = newPass.trim();
                saveToFirebase();
                alert("เปลี่ยนรหัสผ่านสำเร็จ!");
            }
        };

        window.checkAdmin = () => {
            isAdmin = sessionStorage.getItem('isAdmin') === 'true';
            const adminEls = document.querySelectorAll('.admin-only');
            const adminPanel = document.getElementById('admin-panel');
            const btnLogin = document.getElementById('btn-login');

            if (isAdmin) {
                adminEls.forEach(el => el.classList.remove('sys-hidden'));
                adminPanel.classList.remove('sys-hidden');
                adminPanel.classList.add('flex');
                btnLogin.classList.add('sys-hidden');
            } else {
                adminEls.forEach(el => el.classList.add('sys-hidden'));
                adminPanel.classList.add('sys-hidden');
                adminPanel.classList.remove('flex');
                btnLogin.classList.remove('sys-hidden');
            }
        };

        window.promptLogin = () => {
            if (prompt("กรุณาใส่รหัสผ่านผู้ดูแลระบบ:") === dbData.settings.adminPin) {
                sessionStorage.setItem('isAdmin', 'true');
                checkAdmin();
            } else { alert("รหัสผ่านไม่ถูกต้อง"); }
        };

        window.logoutAdmin = () => {
            sessionStorage.removeItem('isAdmin');
            checkAdmin();
        };

        // --- UI Modal ---
        window.openModal = () => {
            document.getElementById('modalTitle').innerText = 'เพิ่มลิงก์ใหม่';
            document.getElementById('linkId').value = '';
            document.getElementById('linkTitle').value = '';
            document.getElementById('linkUrl').value = '';
            document.getElementById('linkGroup').value = '';
            document.getElementById('linkDesc').value = '';
            document.getElementById('linkShade').value = 'light';
            selectColor('blue');
            selectIcon('fa-link');
            const catSelect = document.getElementById('linkCategory');
            catSelect.innerHTML = dbData.categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            document.getElementById('linkModal').classList.remove('sys-hidden');
        };
        window.closeModal = () => document.getElementById('linkModal').classList.add('sys-hidden');
        
        window.openCategoryModal = () => document.getElementById('categoryModal').classList.remove('sys-hidden');
        window.closeCategoryModal = () => document.getElementById('categoryModal').classList.add('sys-hidden');

        window.selectColor = (c) => {
            document.getElementById('linkColor').value = c;
            const btns = document.getElementById('colorPicker').children;
            for(let b of btns) b.classList.remove('ring-4');
            event.target.classList.add('ring-4');
        };
        window.selectIcon = (i) => {
            document.getElementById('linkIcon').value = i;
            const btns = document.getElementById('iconPicker').children;
            for(let b of btns) { b.classList.remove('bg-blue-100', 'border-blue-500'); b.classList.add('border'); }
            const btn = event.currentTarget;
            btn.classList.add('bg-blue-100', 'border-blue-500');
            btn.classList.remove('border');
        };
    </script>
</body>
</html>
